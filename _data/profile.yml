tagline: "I build robots to improve lives."
intro: "Robotics researcher focused on rehabilitation robotics, human sensing, medical robotics, and robot planning for accessible, adaptive therapy."
bio:
  - "I am a Robotics PhD student at the University of Utah in the Human-Robot Empowerment Lab, advised by Professor Laura Hallock. My current work uses electromyography, sonomyography, motion capture, and robot control to quantify human engagement and improve rehabilitation robots."
  - "Before Utah, I earned an MSE in Robotics from the University of Pennsylvania, where I worked with Professor Michelle Johnson and the Rehabilitation Robotics Lab within GRASP on socially assistive robotics, telepresence, and rehabilitation interactions."
  - "I also hold a bachelor's degree in mechatronics from Manipal University with a minor in robotics and automation. Outside the lab, I make photographs, run, bike, climb, and look for quiet ways to keep technical work human."
research_interests:
