highlights:
  - "Developing sensing-driven rehabilitation robot systems that measure muscle engagement during multi-axis upper-limb tasks."
  - "Studying how robot-mediated interfaces and adaptive control can support healthier movement practice after neurological injury."
  - "Exploring social robot augmented telepresence for broader access to rehabilitation care."
